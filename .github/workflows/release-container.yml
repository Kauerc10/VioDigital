name: Release Container

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag opcional para publicação (ex.: v0.2.0)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: kauerc10/viodigital

jobs:
  build-and-push:
    name: Build & Push GHCR Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize manual tag input
        id: tag
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_TAG: ${{ github.event.inputs.tag || '' }}
        run: |
          raw="$(printf '%s' "$INPUT_TAG" | xargs)"
          raw="${raw#refs/tags/}"
          if [[ "$raw" =~ ^v?([0-9]+\.[0-9]+\.[0-9]+([+-].+)?)$ ]]; then
            echo "is_semver=true" >> "$GITHUB_OUTPUT"
            echo "semver=v${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "raw=" >> "$GITHUB_OUTPUT"
          else
            echo "is_semver=false" >> "$GITHUB_OUTPUT"
            echo "semver=" >> "$GITHUB_OUTPUT"
            echo "raw=$raw" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}},enable={{is_tag}}
            type=semver,pattern=v{{version}},enable={{is_tag}}
            type=semver,pattern={{major}}.{{minor}},enable={{is_tag}}
            type=semver,pattern={{version}},value=${{ steps.tag.outputs.semver }},enable=${{ github.event_name == 'workflow_dispatch' && steps.tag.outputs.is_semver == 'true' && github.ref_type != 'tag' }}
            type=semver,pattern=v{{version}},value=${{ steps.tag.outputs.semver }},enable=${{ github.event_name == 'workflow_dispatch' && steps.tag.outputs.is_semver == 'true' && github.ref_type != 'tag' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.tag.outputs.semver }},enable=${{ github.event_name == 'workflow_dispatch' && steps.tag.outputs.is_semver == 'true' && github.ref_type != 'tag' }}
            type=raw,value=${{ steps.tag.outputs.raw }},enable=${{ github.event_name == 'workflow_dispatch' && steps.tag.outputs.raw != '' }}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' && steps.tag.outputs.is_semver == 'false' && steps.tag.outputs.raw == '' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
