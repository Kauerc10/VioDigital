name: CI

on:
  push:
    branches: [main, "feat/*", "feat/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          playwright install --with-deps chromium

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Build static site
        run: |
          python src/viodigital/build_static.py

      - name: Run test suite with pytest
        run: |
          pytest

  docker:
    name: Build & Verify Container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t viodigital:ci .

      - name: Start container and verify /api/health
        run: |
          set -euo pipefail
          docker run -d --name viodigital-ci -p 8000:8000 viodigital:ci
          ready=0
          for i in $(seq 1 20); do
            if response=$(curl -fsS http://127.0.0.1:8000/api/health 2>/dev/null); then
              echo "Health response: $response"
              if echo "$response" | grep -q '"status":"ok"'; then
                ready=1
                break
              fi
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Container failed health check within 20s"
            exit 1
          fi
          curl -fsS http://127.0.0.1:8000/ >/dev/null
          curl -fsS -I http://127.0.0.1:8000/static/vendor/pyodide/pyodide.js >/dev/null
          docker exec viodigital-ci python -c "import os, cv2, pymupdf, zxingcpp; assert os.geteuid() != 0"

      - name: Print container logs on failure
        if: failure()
        run: docker logs viodigital-ci || true

      - name: Remove container
        if: always()
        run: docker rm -f viodigital-ci || true
