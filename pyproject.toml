[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vioweb"
version = "0.1.0"
description = "Verificador e decodificador offline de documentos veiculares (CRLV-e, CNH) Serpro/VIO"
authors = [{ name = "VioWeb Team" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42.0.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "python-multipart>=0.0.9",
    "pillow>=10.0.0",
    "pymupdf>=1.24.0",
    "opencv-python-headless>=4.9.0",
    "zxing-cpp>=2.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vioweb = ["**/*.json", "**/*.html", "**/*.css", "**/*.js"]

[tool.vercel]
entrypoint = "app:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
